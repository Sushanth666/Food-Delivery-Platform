<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <!-- Brand Rose-to-Crimson Gradient -->
    <linearGradient id="cravewave-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Luxury Ambient Glow Filter -->
    <filter id="cravewave-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#E11D48" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Luxury Dark Card Container for Flawless Contrast in Both Light and Dark Modes -->
  <rect x="2" y="2" width="516" height="116" rx="24" fill="#0B0B0E" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>

  <!-- Left: Brand Squircle Icon with UtensilsCrossed Fork & Knife -->
  <g transform="translate(24, 22)" filter="url(#cravewave-glow)">
    <rect width="76" height="76" rx="22" fill="url(#cravewave-gradient)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1.5"/>
    <g transform="translate(17, 17) scale(1.75)" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
      <path d="m16 2-2.3 2.3a3 3 0 0 0 0 4.2l1.8 1.8a3 3 0 0 0 4.2 0L22 8" />
      <path d="M15 15 3.3 3.3a4.2 4.2 0 0 0 0 6l7.3 7.3c.7.7 2 .7 2.8 0L15 15Zm0 0 7 7" />
      <path d="m2.1 21.8 6.4-6.3" />
      <path d="m19 5-7 7" />
    </g>
  </g>

  <!-- Middle: CraveWave Brand Wordmark -->
  <text x="122" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="40" font-weight="900" letter-spacing="-0.8">
    <tspan fill="#FFFFFF">Crave</tspan><tspan fill="#E11D48">Wave</tspan>
  </text>

  <!-- Tagline: Food Delivered Fast -->
  <text x="124" y="87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Inter', sans-serif" font-size="10.5" font-weight="800" letter-spacing="2.8" fill="#FB7185">
    FOOD DELIVERED FAST
  </text>

  <!-- Right: Platform Tag Pill -->
  <rect x="372" y="44" width="124" height="28" rx="8" fill="rgba(225, 29, 72, 0.15)" stroke="rgba(225, 29, 72, 0.35)" stroke-width="1"/>
  <text x="434" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FDA4AF" letter-spacing="0.5" text-anchor="middle">
    LIVE PLATFORM
  </text>
</svg>
